<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Screener">
  <title>Stock Screener</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316a34a'/><path d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <h1>Stock Screener</h1>
        <p id="updated" class="muted">Loading…</p>
      </div>
      <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="wrap tabs" id="tabs" role="tablist" aria-label="Views">
    <button class="tab on" data-tab="screener" role="tab" aria-selected="true">Screener</button>
    <button class="tab" data-tab="tier1" role="tab" aria-selected="false">Tier 1 <span id="t1-count" class="badge" hidden></span></button>
  </nav>

  <main class="wrap">
    <section id="view-tier1" hidden>
      <div id="t1-head" class="t1-head"></div>
      <div id="t1-list" class="t1-list"></div>
      <p id="t1-foot" class="foot muted"></p>
    </section>

    <div id="view-screener">
    <section class="summary" id="summary" aria-label="Market summary"></section>

    <section class="controls">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search symbol, name or sector…" autocomplete="off" spellcheck="false">
        <button id="filters-toggle" class="btn" aria-expanded="false" aria-controls="filters">
          Filters <span id="filter-count" class="badge" hidden></span>
        </button>
      </div>
      <div class="chips" id="presets" role="tablist" aria-label="Screens"></div>

      <form id="filters" class="filters" hidden>
        <label>Sector
          <select name="sector"><option value="">Any</option></select>
        </label>
        <label>Price min <input name="priceMin" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Price max <input name="priceMax" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Market cap
          <select name="capMin">
            <option value="">Any</option>
            <option value="3e8">Small+ (&gt; $300M)</option>
            <option value="2e9">Mid+ (&gt; $2B)</option>
            <option value="1e10">Large+ (&gt; $10B)</option>
            <option value="2e11">Mega (&gt; $200B)</option>
          </select>
        </label>
        <label>P/E max <input name="peMax" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Day change % min <input name="chgMin" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Day change % max <input name="chgMax" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>RSI min <input name="rsiMin" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>RSI max <input name="rsiMax" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Dividend yield % min <input name="divMin" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label>Rel. volume min <input name="rvolMin" type="number" inputmode="decimal" step="any" placeholder="–"></label>
        <label class="check"><input name="above50" type="checkbox"> Above 50-day avg</label>
        <label class="check"><input name="above200" type="checkbox"> Above 200-day avg</label>
        <div class="filter-actions">
          <button type="button" id="filters-reset" class="btn ghost">Clear filters</button>
        </div>
      </form>

      <div class="result-bar">
        <span id="result-count" class="muted"></span>
        <div class="result-actions">
          <label class="sort-mobile">Sort
            <select id="sort-select"></select>
          </label>
          <button id="export" class="btn ghost small">Export CSV</button>
        </div>
      </div>
    </section>

    <div class="table-wrap">
      <table id="grid">
        <thead><tr id="grid-head"></tr></thead>
        <tbody id="grid-body"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>

    <footer class="foot muted">
      Data from Yahoo Finance via an automatic GitHub Action (prices may be delayed). For information only, not financial advice.
      <span id="missing"></span>
    </footer>
    </div>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <div class="d-inner">
      <div class="d-head">
        <div>
          <h2 id="d-title"></h2>
          <p id="d-sub" class="muted"></p>
        </div>
        <div class="d-head-actions">
          <button id="d-fav" class="icon-btn star" aria-label="Favorite">★</button>
          <button id="d-close" class="icon-btn" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="d-price">
        <span id="d-price"></span>
        <span id="d-change"></span>
      </div>
      <div class="ranges" id="d-ranges">
        <button data-r="21">1M</button><button data-r="63">3M</button><button data-r="126">6M</button><button data-r="0" class="on">1Y</button>
      </div>
      <div class="chart" id="d-chart"><p class="muted">Loading chart…</p></div>
      <div id="d-t1" class="t1-box" hidden></div>
      <div class="stats" id="d-stats"></div>
      <p class="d-links">
        <a id="d-yahoo" target="_blank" rel="noopener">Yahoo Finance ↗</a>
        <a id="d-news" target="_blank" rel="noopener">News ↗</a>
      </p>
    </div>
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
